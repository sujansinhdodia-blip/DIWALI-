<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0020" />
      <stop offset="45%" stop-color="#2d1060" />
      <stop offset="80%" stop-color="#7b2d5f" />
      <stop offset="100%" stop-color="#e8751a" />
    </linearGradient>
    <radialGradient id="diyaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FF9933" stop-opacity="0.4" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFF8DC" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Twinkling stars -->
  <g fill="#FFF" opacity="0.8">
    <circle cx="100" cy="80" r="2" />
    <circle cx="250" cy="120" r="3" />
    <circle cx="400" cy="60" r="1.5" />
    <circle cx="550" cy="140" r="2.5" />
    <circle cx="700" cy="90" r="2" />
    <circle cx="880" cy="70" r="3" />
    <circle cx="1050" cy="110" r="2" />
    <circle cx="1140" cy="180" r="1.5" />
    <circle cx="180" cy="220" r="2" />
    <circle cx="950" cy="240" r="2.5" />
  </g>

  <!-- Fireworks bursts -->
  <g stroke="#FFD700" stroke-width="2" opacity="0.7">
    <line x1="200" y1="120" x2="200" y2="90" />
    <line x1="200" y1="120" x2="225" y2="105" />
    <line x1="200" y1="120" x2="225" y2="135" />
    <line x1="200" y1="120" x2="200" y2="150" />
    <line x1="200" y1="120" x2="175" y2="135" />
    <line x1="200" y1="120" x2="175" y2="105" />
  </g>
  <g stroke="#FF1493" stroke-width="2" opacity="0.7">
    <line x1="1000" y1="140" x2="1000" y2="105" />
    <line x1="1000" y1="140" x2="1030" y2="120" />
    <line x1="1000" y1="140" x2="1030" y2="160" />
    <line x1="1000" y1="140" x2="1000" y2="175" />
    <line x1="1000" y1="140" x2="970" y2="160" />
    <line x1="1000" y1="140" x2="970" y2="120" />
  </g>

  <!-- Center Diya Glow -->
  <circle cx="600" cy="420" r="160" fill="url(#diyaGlow)" />

  <!-- Diya Illustration -->
  <g transform="translate(480, 320)">
    <!-- Flame -->
    <ellipse cx="120" cy="50" rx="20" ry="45" fill="#FF4500" opacity="0.8" />
    <ellipse cx="120" cy="52" rx="14" ry="35" fill="#FFD700" opacity="0.9" />
    <ellipse cx="120" cy="56" rx="7" ry="22" fill="#FFF8DC" />
    <line x1="120" y1="90" x2="120" y2="100" stroke="#222" stroke-width="4" stroke-linecap="round" />
    <!-- Diya Bowl -->
    <ellipse cx="120" cy="110" rx="80" ry="18" fill="#8B4513" />
    <path d="M40 110 Q50 170 120 175 Q190 170 200 110" fill="#CD853F" />
    <path d="M45 110 Q55 162 120 168 Q185 162 195 110" fill="#DEB887" />
    <ellipse cx="120" cy="175" rx="50" ry="10" fill="#8B4513" />
  </g>

  <!-- Main Heading -->
  <text x="600" y="170" text-anchor="middle" font-family="'Cinzel Decorative', Georgia, serif" font-size="76" font-weight="bold" fill="url(#goldText)" letter-spacing="4">
    HAPPY DIWALI 🪔
  </text>

  <!-- Subtitle -->
  <text x="600" y="235" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="28" font-weight="300" fill="#FFE4B5" opacity="0.95">
    May your life be filled with light, love, and joy
  </text>

  <!-- Family Signature -->
  <text x="600" y="285" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="24" font-weight="600" fill="#FFD700" letter-spacing="2">
    — FROM THE DARBAR FAMILY —
  </text>

  <!-- Bottom Blessing -->
  <text x="600" y="580" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="22" fill="#FFF" opacity="0.8">
    ✨ Tap to Light the Diya &amp; Enjoy Fireworks ✨
  </text>
</svg>
